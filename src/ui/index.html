<!doctype html><html lang="tr"><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; media-src 'self' blob:; connect-src 'none'">
<title>Umay</title><link rel="stylesheet" href="style.css">
<header><h1>UMAY <small>Windows · 0.1.1</small></h1><button id="login">Tarayıcıda giriş / kayıt</button><button id="logout">Çıkış yap</button><button id="theme">Açık / koyu</button></header>
<nav><button data-page="chat">Sohbet</button><button data-page="settings">Ayarlar / Konuşma</button><button data-page="memory">Hafıza</button></nav>
<p id="status" role="status">Hazır. Hesabınızı bağlayın ve konuşma paketlerini kurun.</p>
<section id="chat"><aside><button id="refresh">Hesabı yenile</button><select id="models" aria-label="Model"></select><button id="new">Yeni sohbet</button><div id="history"></div></aside><main><div id="messages" aria-live="polite"></div><form id="send"><textarea id="input" placeholder="Umay’a sor" maxlength="12000" required></textarea><button>Gönder</button></form><button id="listen">Konuşmayı başlat</button><button id="stop">Durdur</button><label><input type="checkbox" id="speak" checked> Yanıtları seslendir</label><p id="voice-status"></p></main></section>
<section id="settings" hidden><h2>Konuşma bileşenleri</h2><p>Modeller bu cihazda çalışır. Sohbet yanıtları Veriüssü üzerinden gelir.</p><button id="hardware">Donanımı algıla</button><pre id="devices"></pre><div id="packages"></div><button id="cancel-install">İşlemi iptal et</button><h2>Ses klonlama</h2><p>En fazla 50 MB MP3, en fazla 10 dakika.</p><button id="clone">MP3 seç ve klonla</button><select id="voices" aria-label="Ses profili"><option value="">Varsayılan ses</option></select><button id="select-voice">Sesi seç</button><button id="preview">Önizle</button><button id="delete-voice">Profili sil</button><h2>Güncelleme</h2><button id="update">Güncellemeleri kontrol et</button><button id="restart" hidden>Güncelle ve yeniden başlat</button></section>
<section id="memory" hidden><h2>Veriüssü hafızası</h2><button id="load-memory">Hafızayı getir</button><pre id="memory-data"></pre></section>
<script src="renderer.js"></script></html>
